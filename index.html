<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17203A">
<title>Baatcheet</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#F8F9FB;color:#17203A;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid #2F54EB;outline-offset:2px}
#app{display:flex;height:100dvh;overflow:hidden}
#side{position:fixed;top:0;bottom:0;left:0;width:18rem;background:#17203A;color:#E6EAF5;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .2s ease;z-index:30}
#side.open{transform:none}
#side button:focus-visible{outline-color:#9DB2FF}
#scrim{position:fixed;inset:0;background:rgba(23,32,58,.45);z-index:20;display:none}
#scrim.show{display:block}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px}
.brand{font-size:18px;font-weight:600}
.icon-btn{padding:8px 10px;border-radius:8px;font-size:18px;line-height:1}
#newchat{margin:0 12px 12px;padding:10px 12px;border:1px solid rgba(255,255,255,.25);border-radius:10px;text-align:left;font-weight:500}
#list{flex:1;overflow-y:auto;padding:0 12px 12px}
.row{display:flex;align-items:center;border-radius:10px}
.row:hover{background:rgba(255,255,255,.08)}
.row.active{background:rgba(255,255,255,.14)}
.row .open-btn{flex:1;min-width:0;text-align:left;padding:10px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .del{color:#9AA6C4;padding:8px 10px;border-radius:8px}
.none{color:#9AA6C4;padding:8px 12px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #D5DBE7}
#title{margin:0;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scroll{flex:1;overflow-y:auto}
#thread{max-width:48rem;margin:0 auto;padding:20px 16px}
.u{display:flex;justify-content:flex-end;margin:16px 0}
.bubble{background:#17203A;color:#F8F9FB;border-radius:18px 18px 4px 18px;padding:10px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.a{margin:16px 0;line-height:1.65;overflow-wrap:anywhere}
.a p{margin:8px 0;white-space:pre-wrap}
.a p.h{font-weight:600;margin-top:16px}
.a ul,.a ol{margin:8px 0;padding-left:22px}
.a li{margin:4px 0}
.ic{background:#E4E9F3;padding:1px 6px;border-radius:5px;font-size:.9em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.code{background:#182036;color:#E6EAF5;border-radius:12px;overflow:hidden;margin:12px 0}
.code-head{display:flex;justify-content:space-between;align-items:center;background:#222C47;color:#AEB9D6;font-size:12px;padding:6px 12px}
.code-head button{padding:4px 8px;border-radius:6px}
.code pre{margin:0;padding:12px;overflow-x:auto;font-size:13.5px;line-height:1.55}
.code pre code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.empty{padding-top:32px}
.empty h2{font-size:24px;margin:0 0 4px}
.empty p{color:#5B667F;margin:0 0 20px}
.starter{display:block;width:100%;text-align:left;background:#fff;border:1px solid #D5DBE7;border-radius:12px;padding:12px 16px;margin-bottom:8px}
.starter:hover{border-color:#2F54EB}
.dots{display:flex;gap:6px;margin:16px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#5B667F;animation:b 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.err{background:#FDECEC;color:#7A1F1F;border-radius:12px;padding:12px 16px;margin:16px 0;display:flex;gap:12px;justify-content:space-between;align-items:center}
.err button{font-weight:600;text-decoration:underline;flex-shrink:0}
#composer-wrap{padding:4px 12px calc(12px + env(safe-area-inset-bottom))}
#composer{max-width:48rem;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:#fff;border:1px solid #D5DBE7;border-radius:20px;padding:8px 8px 8px 16px}
#composer:focus-within{border-color:#2F54EB}
#input{flex:1;resize:none;border:0;outline:0;background:transparent;font:inherit;padding:8px 0;max-height:160px;color:inherit}
#send{width:36px;height:36px;border-radius:50%;background:#2F54EB;color:#fff;font-size:18px;flex-shrink:0}
#send:disabled{background:#C9D0E2;cursor:not-allowed}
@media (min-width:768px){#side{position:static;transform:none}#scrim{display:none!important}.menu{display:none}}
@media (prefers-reduced-motion:reduce){#side{transition:none}.dots i{animation:none;opacity:.6}}
</style>
</head>
<body>
<div id="app">
  <div id="scrim"></div>
  <aside id="side" aria-label="Conversations">
    <div class="side-top">
      <span class="brand">Baatcheet</span>
      <button class="icon-btn menu" id="closeMenu" aria-label="Close menu">&#10005;</button>
    </div>
    <button id="newchat">+ New chat</button>
    <nav id="list"></nav>
  </aside>
  <main>
    <header>
      <button class="icon-btn menu" id="openMenu" aria-label="Open menu">&#9776;</button>
      <h1 id="title">New chat</h1>
    </header>
    <div id="scroll"><div id="thread"></div></div>
    <div id="composer-wrap">
      <div id="composer">
        <textarea id="input" rows="1" placeholder="Message Baatcheet" aria-label="Message"></textarea>
        <button id="send" aria-label="Send message" disabled>&#8593;</button>
      </div>
    </div>
  </main>
</div>

<script>
const KEY = "baatcheet-v1";
const STARTERS = [
  "Explain async/await with a small example",
  "Write a SQL query to find duplicate emails",
  "How do I stream an API response in Next.js?"
];

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { convos: [], activeId: null }; }
  catch (e) { return { convos: [], activeId: null }; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { console.error(e); }
}

let state = load();
let loading = false;
let error = null;

const $ = (id) => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 10);
const active = () => state.convos.find((c) => c.id === state.activeId) || null;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function inline(parent, text) {
  text.split(/(`[^`]+`|\*\*[^*]+\*\*)/g).forEach((p) => {
    if (p.length > 2 && p[0] === "`" && p.endsWith("`")) parent.appendChild(el("code", "ic", p.slice(1, -1)));
    else if (p.length > 4 && p.startsWith("**") && p.endsWith("**")) parent.appendChild(el("strong", null, p.slice(2, -2)));
    else if (p) parent.appendChild(document.createTextNode(p));
  });
}

function codeBlock(lang, code) {
  const box = el("div", "code");
  const head = el("div", "code-head");
  head.appendChild(el("span", null, lang || "code"));
  const btn = el("button", null, "Copy");
  btn.type = "button";
  btn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(code);
      btn.textContent = "Copied";
    } catch (e) {
      btn.textContent = "Copy failed";
    }
    setTimeout(() => (btn.textContent = "Copy"), 1500);
  };
  head.appendChild(btn);
  const pre = el("pre");
  pre.appendChild(el("code", null, code));
  box.append(head, pre);
  return box;
}

function listBlock(tag, lines, re) {
  const list = el(tag);
  lines.forEach((l) => {
    const li = el("li");
    inline(li, l.replace(re, ""));
    list.appendChild(li);
  });
  return list;
}

function rich(text) {
  const frag = document.createDocumentFragment();
  text.split("```").forEach((seg, i) => {
    if (i % 2 === 1) {
      const nl = seg.indexOf("\n");
      const lang = nl === -1 ? "" : seg.slice(0, nl).trim();
      const code = (nl === -1 ? seg : seg.slice(nl + 1)).replace(/\n$/, "");
      frag.appendChild(codeBlock(lang, code));
      return;
    }
    seg.split(/\n{2,}/).filter((b) => b.trim()).forEach((b) => {
      const lines = b.split("\n");
      if (lines.every((l) => /^\s*[-*]\s+/.test(l))) {
        frag.appendChild(listBlock("ul", lines, /^\s*[-*]\s+/));
      } else if (lines.every((l) => /^\s*\d+\.\s+/.test(l))) {
        frag.appendChild(listBlock("ol", lines, /^\s*\d+\.\s+/));
      } else {
        const h = lines.length === 1 ? b.match(/^#{1,3}\s+(.*)$/) : null;
        const p = el("p", h ? "h" : null);
        inline(p, h ? h[1] : b);
        frag.appendChild(p);
      }
    });
  });
  return frag;
}

function renderList() {
  const list = $("list");
  list.replaceChildren();
  const sorted = [...state.convos].sort((a, b) => b.updatedAt - a.updatedAt);
  if (!sorted.length) list.appendChild(el("p", "none", "No chats yet. Send a message to start one."));
  sorted.forEach((c) => {
    const row = el("div", "row" + (c.id === state.activeId ? " active" : ""));
    const open = el("button", "open-btn", c.title);
    open.onclick = () => { state.activeId = c.id; error = null; save(); closeMenu(); render(); };
    const del = el("button", "del", "\u{1F5D1}");
    del.setAttribute("aria-label", "Delete chat: " + c.title);
    del.onclick = () => {
      state.convos = state.convos.filter((x) => x.id !== c.id);
      if (state.activeId === c.id) state.activeId = null;
      save(); render();
    };
    row.append(open, del);
    list.appendChild(row);
  });
}

function render() {
  const c = active();
  $("title").textContent = c ? c.title : "New chat";
  const th = $("thread");
  th.replaceChildren();

  if (!c) {
    const empty = el("div", "empty");
    empty.appendChild(el("h2", null, "What are we building?"));
    empty.appendChild(el("p", null, "Ask a question or paste some code. Chats save automatically on this device."));
    STARTERS.forEach((s) => {
      const b = el("button", "starter", s);
      b.onclick = () => send(s);
      empty.appendChild(b);
    });
    th.appendChild(empty);
  } else {
    c.messages.forEach((m) => {
      if (m.role === "user") {
        const row = el("div", "u");
        row.appendChild(el("div", "bubble", m.content));
        th.appendChild(row);
      } else {
        const a = el("div", "a");
        a.appendChild(rich(m.content));
        th.appendChild(a);
      }
    });
  }

  if (loading) {
    const d = el("div", "dots");
    d.setAttribute("role", "status");
    d.setAttribute("aria-label", "Waiting for a reply");
    d.append(el("i"), el("i"), el("i"));
    th.appendChild(d);
  }

  if (error && error.id === state.activeId) {
    const box = el("div", "err");
    box.appendChild(el("span", null, "The reply didn't load (" + error.message + "). Check your connection and retry."));
    const r = el("button", null, "Retry");
    r.onclick = () => { const cur = active(); if (cur && !loading) ask(cur); };
    box.appendChild(r);
    th.appendChild(box);
  }

  renderList();
  $("scroll").scrollTop = $("scroll").scrollHeight;
  $("send").disabled = loading || !$("input").value.trim();
}

async function ask(c) {
  loading = true;
  error = null;
  render();
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: c.messages.map((m) => ({ role: m.role, content: m.content })) })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "status " + res.status);
    if (!data.reply) throw new Error("empty reply");
    c.messages.push({ role: "assistant", content: data.reply });
    c.updatedAt = Date.now();
    save();
  } catch (e) {
    console.error(e);
    error = { id: c.id, message: e.message };
  } finally {
    loading = false;
    render();
  }
}

async function send(raw) {
  const text = raw.trim();
  if (!text || loading) return;
  let c = active();
  if (!c) {
    c = { id: uid(), title: text.slice(0, 40), messages: [], updatedAt: Date.now() };
    state.convos.unshift(c);
    state.activeId = c.id;
  }
  c.messages.push({ role: "user", content: text });
  c.updatedAt = Date.now();
  save();
  $("input").value = "";
  resize();
  await ask(c);
}

function resize() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 160) + "px";
}

function openMenu() { $("side").classList.add("open"); $("scrim").classList.add("show"); }
function closeMenu() { $("side").classList.remove("open"); $("scrim").classList.remove("show"); }

$("openMenu").onclick = openMenu;
$("closeMenu").onclick = closeMenu;
$("scrim").onclick = closeMenu;
$("newchat").onclick = () => { state.activeId = null; error = null; save(); closeMenu(); render(); };
$("send").onclick = () => send($("input").value);
$("input").addEventListener("input", () => { resize(); $("send").disabled = loading || !$("input").value.trim(); });
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(min-width:768px)").matches) {
    e.preventDefault();
    send($("input").value);
  }
});

render();
</script>
</body>
</html>
